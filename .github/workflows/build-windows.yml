name: Release Windows app
on:
  workflow_dispatch:
  push:
    tags: ['windows-v*']
permissions:
  contents: read
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - id: meta
        run: |
          $spec = Get-Content release/platforms.json -Raw | ConvertFrom-Json
          "version=$($spec.windows.version)" >> $env:GITHUB_OUTPUT
          "build=$($spec.windows.build)" >> $env:GITHUB_OUTPUT
          "tag=windows-v$($spec.windows.version)-build$($spec.windows.build)" >> $env:GITHUB_OUTPUT
          "asset=BookWorm-$($spec.windows.version)-build$($spec.windows.build)-Windows-x64.zip" >> $env:GITHUB_OUTPUT
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          EXPECTED: ${{ steps.meta.outputs.tag }}
        run: if ($env:GITHUB_REF_NAME -ne $env:EXPECTED) { throw 'Tag does not match platform version' }
      - name: Prepare private cloud configuration
        env:
          CLOUD_CONFIG_WINDOWS: ${{ secrets.CLOUD_CONFIG_WINDOWS }}
        run: python scripts/ci/release_tools.py configure windows
      - run: flutter pub get
      - name: Build Windows Release
        run: flutter build windows --release --build-name=${{ steps.meta.outputs.version }} --build-number=${{ steps.meta.outputs.build }} --dart-define-from-file=cloud-config.release.json
      - name: Verify runtime dependencies and executable startup
        run: ./scripts/ci/check_windows_runtime.ps1
      - name: Package Release
        run: |
          python scripts/ci/release_tools.py package windows
          $asset = '${{ steps.meta.outputs.asset }}'
          $hash = (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/SHA256SUMS-Windows.txt'), "$hash  $asset`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: BookWorm-Windows-Release-${{ steps.meta.outputs.version }}-build${{ steps.meta.outputs.build }}
          path: |
            dist/*.zip
            dist/SHA256SUMS-Windows.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish Windows download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BookWorm Windows ${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.build }})
          draft: false
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/SHA256SUMS-Windows.txt
          body: |
            Windows x64 Release build generated by GitHub Actions. Includes the latest concurrent reading/transfers and corrected swipe direction.

            Extract the entire ZIP to a writable folder and run bookworm.exe. Keep data and all DLLs beside it. Release Visual C++ runtime DLLs are included; this package does not require msvcp140d.dll or a Visual Studio debug runtime.

            Unsigned portable app. CI checks native DLL dependencies and executable startup; reader and audio behavior still require user verification.

            Build source: ${{ github.sha }}
            Build log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - if: always()
        name: Remove private build configuration
        run: python scripts/ci/release_tools.py cleanup
