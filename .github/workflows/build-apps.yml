name: Build BookWorm apps
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - if: matrix.target == 'windows'
        run: flutter build windows --debug
      - if: matrix.target == 'macos'
        run: |
          flutter build macos --debug --config-only
          cd macos && pod install && cd ..
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Debug -derivedDataPath build/macos CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: BookWorm-${{ matrix.target }}-debug
          path: |
            build/macos/Build/Products/Debug/*.app
            build/windows/x64/runner/Debug/
          retention-days: 7
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - run: flutter pub get
      # The shared Run scheme stays Release for independently launchable phones.
      # Select Debug only in this disposable simulator checkout.
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme')
          p.write_text(p.read_text().replace('<LaunchAction\n      buildConfiguration = "Release"', '<LaunchAction\n      buildConfiguration = "Debug"', 1))
          PY
          flutter build ios --simulator --debug --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: BookWorm-ios-simulator-debug
          path: build/ios/iphonesimulator/*.app
          retention-days: 7
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: BookWorm-android-debug
          path: build/app/outputs/flutter-apk/*debug.apk
          retention-days: 7
